<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neodesk — ভয়েস কল উইজেট ডেমো</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Host page placeholder, so the widget has something to float over -->
  <main class="host-page">
    <h1>Neodesk</h1>
    <p>Ergonomic Office Chairs &amp; Workspace Essentials</p>
  </main>

  <!-- Floating launcher bubble -->
  <button class="launcher" id="launcherBtn" aria-label="AI-এর সাথে কথা বলুন">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path
        d="M6.6 10.8c1.2 2.4 3.2 4.4 5.6 5.6l1.9-1.9c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9 0-16-7-16-16 0-.6.4-1 1-1h3.1c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1z"
        fill="currentColor"
      />
    </svg>
  </button>

  <!-- Voice call widget -->
  <section class="call-widget" id="callWidget" hidden>
    <header class="widget-top">
      <button class="icon-btn" id="speakerToggle" aria-label="সাউন্ড অন/অফ" title="সাউন্ড অন/অফ">
        <svg id="speakerIcon" width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" />
          <path d="M16.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
        </svg>
      </button>
      <span class="widget-title">রিমি · Neodesk</span>
      <button class="icon-btn" id="closeWidget" aria-label="বন্ধ করুন" title="বন্ধ করুন">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </header>

    <div class="avatar-wrap">
      <div class="avatar-ring" id="avatarRing">
        <div class="avatar">
          <svg width="52" height="52" viewBox="0 0 64 64" fill="none">
            <circle cx="32" cy="26" r="14" fill="#F3EFE6" />
            <path
              d="M10 56c2-11 11-19 22-19s20 8 22 19"
              fill="#F3EFE6"
            />
            <path
              d="M18 24a14 14 0 0 1 28 0"
              stroke="#B8863B"
              stroke-width="3"
              stroke-linecap="round"
              fill="none"
            />
            <rect x="15" y="23" width="5" height="9" rx="2.5" fill="#B8863B" />
            <rect x="44" y="23" width="5" height="9" rx="2.5" fill="#B8863B" />
            <path d="M46.5 32v3a6 6 0 0 1-6 6h-3" stroke="#B8863B" stroke-width="3" stroke-linecap="round" fill="none" />
          </svg>
        </div>
      </div>
      <p class="status-text" id="statusText">কল শুরু করতে প্রস্তুত</p>
    </div>

    <div class="field-row">
      <label for="nameInput" class="sr-only">আপনার নাম</label>
      <input type="text" id="nameInput" value="তানভীর আহমেদ" />
    </div>

    <div class="lang-row">
      <span class="flag">🇧🇩</span>
      <select id="langSelect" aria-label="ভাষা নির্বাচন করুন">
        <option value="bn" selected>বাংলা</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="transcript" id="transcript"></div>

    <div class="controls-row">
      <button class="mic-btn" id="micBtn" aria-label="মাইক্রোফোন" title="মাইক্রোফোন">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor" />
          <path d="M6 11a6 6 0 0 0 12 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none" />
          <path d="M12 17v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        </svg>
      </button>
      <button class="call-btn" id="callBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path
            d="M6.6 10.8c1.2 2.4 3.2 4.4 5.6 5.6l1.9-1.9c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.5.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1-9 0-16-7-16-16 0-.6.4-1 1-1h3.1c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.5.1.4 0 .8-.2 1z"
            fill="currentColor"
          />
        </svg>
        <span id="callBtnLabel">Start Call</span>
      </button>
    </div>

    <p class="powered-by">Powered By: <strong>Neodesk</strong></p>
  </section>

  <audio id="ttsAudio" hidden></audio>

  <script src="script.js"></script>
</body>
</html>
